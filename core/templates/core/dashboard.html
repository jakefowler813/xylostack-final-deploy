{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Your Instrument Stacks</h1>
        <a href="{% url 'add_stack' %}" class="btn btn-success">+ New Stack</a>
    </div>

    <div class="row">
        {% for stack in stacks %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white d-flex justify-content-between">
                    <span>{{ stack.title }}</span>
                    <span class="badge bg-secondary">{{ stack.keys.count }} Keys</span>
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <a href="{% url 'song_list' %}?stack={{ stack.id }}" class="btn btn-primary">
                            🎹 Play a Song
                        </a>
                        <div class="btn-group">
                            <a href="{% url 'edit_stack' stack.id %}" class="btn btn-sm btn-outline-secondary">Edit</a>
                            <a href="{% url 'delete_stack' stack.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <p class="text-muted">You haven't created any instrument stacks yet.</p>
            <a href="{% url 'add_stack' %}" class="btn btn-primary">Create Your First Stack</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
