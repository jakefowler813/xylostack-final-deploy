{% extends "base.html" %}

{% block content %}
<div class="text-center py-5">
    <h2 class="text-danger mb-4">Delete Stack?</h2>
    <p class="lead mb-5">Are you sure you want to delete <strong>"{{ stack.title }}"</strong>? This action cannot be undone.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4 shadow">Yes, Delete Forever</button>
        </div>
    </form>
</div>
{% endblock %}
