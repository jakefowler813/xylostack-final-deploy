{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="mb-4">
            <i class="bi bi-door-open-fill text-warning display-3"></i>
            <h2 class="fw-800 mt-2">Logging Out?</h2>
            <p class="text-muted">Are you sure you want to sign out of XyloStack?</p>
        </div>

        <div class="card border-0 bg-light p-4 rounded-4 shadow-sm">
            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                {% endif %}
                
                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-danger btn-lg shadow-sm rounded-pill">
                        <i class="bi bi-check2-circle me-2"></i>Yes, Log Me Out
                    </button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-pill">
                        Stay Logged In
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
