{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="mb-4">
            <i class="bi bi-person-plus-fill text-indigo display-3"></i>
            <h2 class="fw-800 mt-2">Create Account</h2>
            <p class="text-muted">Join XyloStack to start designing your own digital instruments.</p>
        </div>

        <div class="card border-0 bg-white p-4 rounded-4 shadow-sm text-start">
            <form class="signup" id="signup_form" method="post" action="{% url 'account_signup' %}">
                {% csrf_token %}
                {{ form|crispy }}
                
                {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                {% endif %}

                <div class="d-grid gap-2 mt-4">
                    <button class="btn btn-primary btn-lg shadow-sm" type="submit">
                        Get Started
                    </button>
                </div>
            </form>
        </div>

        <p class="mt-4 text-muted small">
            Already have an account? 
            <a href="{% url 'account_login' %}" class="text-indigo fw-bold text-decoration-none">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
