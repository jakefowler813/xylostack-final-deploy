{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="mb-4">
            <i class="bi bi-person-badge-fill text-indigo display-3"></i>
            <h2 class="fw-800 mt-2">Welcome Back</h2>
            <p class="text-muted">Log in to manage your instrument stacks and play your saved songs.</p>
        </div>

        <div class="card border-0 bg-white p-4 rounded-4 shadow-sm text-start">
            <form class="login" method="POST" action="{% url 'account_login' %}">
                {% csrf_token %}
                {{ form|crispy }}
                
                {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                {% endif %}

                <div class="d-grid gap-2 mt-4">
                    <button class="btn btn-primary btn-lg shadow-sm" type="submit">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </div>
            </form>
        </div>

        <p class="mt-4 text-muted small">
            Don't have an account yet? 
            <a href="{% url 'account_signup' %}" class="text-indigo fw-bold text-decoration-none">Sign up here</a>
        </p>
    </div>
</div>

<style>
    .text-indigo { color: #6366F1; }
</style>
{% endblock %}
